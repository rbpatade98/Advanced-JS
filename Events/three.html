<script>
    // Run every 1 second
var intervalId = setInterval(function() {
  console.log("Hello");
}, 1000);

// Stop after 3 seconds
setTimeout(function() {
  clearInterval(intervalId);
  console.log("Stopped!");
}, 3000);

</script>
