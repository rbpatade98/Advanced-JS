<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUESS THE NUMBER</title>
    <link rel="stylesheet" href="guess.css">
</head>
<body>
    <div id="wrapper">
        <h1>Number Guessing Game</h1>
        <p>Try and guess the numer between 1 to 100</p>
        <p>You have 10 attempt to guess the right number</p>
    </div>
    <br>
    <form>
        <label for="guessField" id="guess">Guess a Number</label>
        <input type="text" id="guessField" class="guessField">
        <input type="submit" id="subt" value="submit guess" class="guess submit">
    </form>
    <div class="result paras">
        <p>previous guess<span class="guess"></span></p>
        <p>guess remaining<span class="lastResult">10</span></p>
        <p class="LowOrHigh"></p>
    </div>
</body>
<script src="guess.js"></script>
</html>
